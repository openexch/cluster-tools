# The Aeron-linked build (critic D10): the cluster client, the transport adapters, codegen
# for the cluster protocol + money-schema + order-schema, the codec goldens and every unit
# test that needs generated code. Separate from ci.yml on purpose: ci.yml stays the fast
# WITH_AERON=OFF hexagon job on every PR; this one only runs when a path it builds changes.
#
# Every input is the dependencies.lock pin, fetched and sha256-verified by the same scripts a
# developer runs (scripts/fetch-deps.sh, scripts/fetch-schemas.sh); the CMake configure step
# re-verifies the Aeron version and the SBE jars and checks the schemas' structure.
#
# Not here: the real-cluster integration run (client/it/run-it.sh). It needs assets and match
# jars built at the pinned commits, and those builds depend on runtime cluster-kit versions
# that are not published to a registry yet; it runs locally and moves into the fixture (RC2
# S14) once the runtime jars are artifacts. The archive integration run (archive/it/run-it.sh,
# RC2 S9a 9.3) is local and in the S14 fixture as well; this job builds its binaries
# (-DWITH_BRIDGE=ON) and runs the pure, codec-layout and adapter tests. RC2 S12: the forwarder's domain, codec,
# agent (two fake transports), config and supervisor tests and their negative-control tables run here too
# (forwarder.*); its T1 run (app/forwarder/it/run-forwarder-it.sh) is local like the other integration runs.
name: aeron

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'dependencies.lock'
      - 'scripts/**'
      - 'client/**'
      - 'archive/**'
      - 'adapters/**'
      - 'ports/**'
      - 'domain/**'
      - 'app/**'
      - 'app/journal-tail/**'
      - 'app/forwarder/**'
      - 'domain/forwarder/**'
      - 'poc/**'
      - '.github/workflows/aeron.yml'

jobs:
  aeron:
    runs-on: ubuntu-24.04
    env:
      CMAKE_VERSION: 3.31.6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Aeron 1.53.1 needs cmake >= 3.30; pinned Kitware tarball, as publish.yml does.
      - name: Install cmake
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-$(uname -m).tar.gz" \
            -o "${RUNNER_TEMP}/cmake.tgz"
          tar -xzf "${RUNNER_TEMP}/cmake.tgz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/cmake-${CMAKE_VERSION}-linux-$(uname -m)/bin" >> "$GITHUB_PATH"

      # The cache only saves downloads: fetch-deps.sh re-verifies every cached file against the
      # lock and re-extracts Aeron from the verified tarball on every run.
      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: deps-cache
          key: deps-${{ hashFiles('dependencies.lock') }}

      - name: Fetch and verify the pinned dependencies
        id: deps
        run: |
          set -euo pipefail
          scripts/fetch-deps.sh "${PWD}/deps-cache" > deps.args
          cat deps.args
          echo "args=$(tr '\n' ' ' < deps.args)" >> "$GITHUB_OUTPUT"

      - name: Read the schema pins
        id: pins
        run: |
          set -euo pipefail
          lock() { python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' dependencies.lock "$1"; }
          echo "money_ref=$(lock money_schema_ref)" >> "$GITHUB_OUTPUT"
          echo "match_ref=$(lock match_schema_ref)" >> "$GITHUB_OUTPUT"

      - name: Check out assets at the money-schema pin
        uses: actions/checkout@v4
        with:
          repository: openexch/assets
          ref: ${{ steps.pins.outputs.money_ref }}
          path: pinned/assets
          sparse-checkout: assets-common/src/main/resources/sbe
          sparse-checkout-cone-mode: false

      - name: Check out match at the order-schema pin
        uses: actions/checkout@v4
        with:
          repository: openexch/match
          ref: ${{ steps.pins.outputs.match_ref }}
          path: pinned/match
          sparse-checkout: match-common/src/main/resources/sbe
          sparse-checkout-cone-mode: false

      - name: Extract and verify the schemas
        id: schemas
        run: |
          set -euo pipefail
          scripts/fetch-schemas.sh "${RUNNER_TEMP}/schemas" pinned/assets pinned/match > schemas.args
          cat schemas.args
          echo "args=$(tr '\n' ' ' < schemas.args)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          # shellcheck disable=SC2086 # the args are -D flags, one per word
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWITH_AERON=ON -DWITH_BRIDGE=ON \
            ${{ steps.deps.outputs.args }} ${{ steps.schemas.outputs.args }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
