# Domain-side CI only: configure with WITH_AERON=OFF, build, run the tests (domain,
# ports, json adapter, the pure cluster-client parts). The Aeron-linked build and its
# tests run in aeron.yml, path-filtered, so this job stays fast (critic D10).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DWITH_AERON=OFF
      - name: build
        run: cmake --build build -j
      - name: test
        run: ctest --test-dir build --output-on-failure
