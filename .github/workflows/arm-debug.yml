# TEMPORARY (removed before merge): the aarch64 bridge tests on a branch push, no publish, no AWS.
name: arm-debug

on:
  push:
    branches: [fix/arm-bridge-tests]

jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CMAKE_VERSION: 3.31.6
    steps:
      - uses: actions/checkout@v7

      # SBE codegen is java (adapters/sbe/gen-codecs.sh), with the sbe-tool + agrona jars
      # that scripts/fetch-deps.sh fetches and verifies against dependencies.lock.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Aeron 1.53.1 needs cmake >= 3.30 and ubuntu 24.04's apt ships 3.28. Same
      # pinned Kitware tarball poc/Dockerfile.builder installs - deterministic,
      # rather than trusting whatever the runner image happens to carry this week.
      - name: Install cmake
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-$(uname -m).tar.gz" \
            -o "${RUNNER_TEMP}/cmake.tgz"
          tar -xzf "${RUNNER_TEMP}/cmake.tgz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/cmake-${CMAKE_VERSION}-linux-$(uname -m)/bin" >> "$GITHUB_PATH"

      # The cache only saves downloads: fetch-deps.sh re-verifies every cached file against
      # the lock and re-extracts Aeron from the verified tarball on every run.
      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: deps-cache
          key: deps-${{ hashFiles('dependencies.lock') }}-arm64

      - name: Fetch and verify the pinned dependencies
        id: deps
        env:
          # The harness jar is published as a GitHub release asset of openexch/assets
          # (releases/download/harness-<sha>/, the lock's feed_harness_url); its sha256 is pinned.
          CT_ARTIFACT_BASE_URL: https://github.com/openexch/assets
        run: |
          set -euo pipefail
          # --harness: WITH_BRIDGE (ct-bridge) requires the S9h feed harness jar the lock pins (feed_harness_url)
          scripts/fetch-deps.sh "${PWD}/deps-cache" --harness > deps.args
          echo "args=$(tr '\n' ' ' < deps.args)" >> "$GITHUB_OUTPUT"

      - name: Read the schema pins
        id: pins
        run: |
          set -euo pipefail
          lock() { python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' dependencies.lock "$1"; }
          echo "money_ref=$(lock money_schema_ref)" >> "$GITHUB_OUTPUT"
          echo "match_ref=$(lock match_schema_ref)" >> "$GITHUB_OUTPUT"

      # The engine wire schemas the tools speak, at the commits the lock pins (never a branch
      # tip, never vendored: two copies of a wire schema drift).
      - name: Check out assets at the money-schema pin
        uses: actions/checkout@v4
        with:
          repository: openexch/assets
          ref: ${{ steps.pins.outputs.money_ref }}
          path: pinned/assets
          sparse-checkout: assets-common/src/main/resources/sbe
          sparse-checkout-cone-mode: false

      - name: Check out match at the order-schema pin
        uses: actions/checkout@v4
        with:
          repository: openexch/match
          ref: ${{ steps.pins.outputs.match_ref }}
          path: pinned/match
          sparse-checkout: match-common/src/main/resources/sbe
          sparse-checkout-cone-mode: false

      - name: Extract and verify the schemas
        id: schemas
        run: |
          set -euo pipefail
          scripts/fetch-schemas.sh "${RUNNER_TEMP}/schemas" pinned/assets pinned/match > schemas.args
          echo "args=$(tr '\n' ' ' < schemas.args)" >> "$GITHUB_OUTPUT"

      # Release because these binaries are what the box runs, not a test build.
      # (ci.yml's default-type build is fine for tests; a published artifact is not
      # allowed to be an unoptimised accident.) Aeron (client, driver, aeronmd) is built
      # from the verified source tree inside this one cmake build.
      - name: Build
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # the args are -D flags, one per word
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_AERON=ON -DWITH_BRIDGE=ON \
            ${{ steps.deps.outputs.args }} ${{ steps.schemas.outputs.args }}
          cmake --build build -j"$(nproc)"

      - name: The two failing tests and their tables
        run: ctest --test-dir build --output-on-failure -R '^(bridge\.twolane|bridge\.twolane_negative_controls|bridge\.app|bridge\.app_negative_controls|archive\.pure|archive\.negative_controls)$'

      - name: Every test
        if: always()
        run: ctest --test-dir build --output-on-failure
