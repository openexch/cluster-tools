# Idle overlay of the external media driver (aeronmd): the sleep idle mode, the same vocabulary as every
# process's idle setting (TRANSPORT_IDLE_MODE, FWD_IDLE_MODE, BRIDGE_IDLE_MODE). Loaded LAST:
#   aeronmd driver.properties driver-<dev|prod>.properties driver-idle-sleep.properties
# so the threading mode comes from the profile overlay and the idle strategies from this file (a later file wins).
# An idle overlay sets the idle strategy of every agent role (and the sleep duration) only, never the threading mode
# (scripts/stage-driver-properties.sh refuses any other key; runtime.idle_mode checks the values against
# runtime/include/cluster_tools/runtime/IdleMode.h, the mapping the embedded driver uses).
# sleep: Aeron "sleep-ns" (aeron_idle_strategy_sleeping) for 1 ms per idle iteration, no spin, no yield
# (the Java engines' SleepingMillisIdleStrategy(1)).
aeron.conductor.idle.strategy=sleep-ns
aeron.sender.idle.strategy=sleep-ns
aeron.receiver.idle.strategy=sleep-ns
aeron.shared.idle.strategy=sleep-ns
aeron.sharednetwork.idle.strategy=sleep-ns
aeron.conductor.idle.strategy.init.args=1ms
aeron.sender.idle.strategy.init.args=1ms
aeron.receiver.idle.strategy.init.args=1ms
aeron.shared.idle.strategy.init.args=1ms
aeron.sharednetwork.idle.strategy.init.args=1ms
