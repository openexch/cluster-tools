# Prod overlay of the external media driver (aeronmd), loaded after the pinned
# driver.properties: DEDICATED threading and noop (busy-spin) idles. Three
# threads (conductor, sender, receiver) each spin a CPU; pin the driver to
# CPUs it does not share with its process.
# An overlay sets threading and idle strategies only (scripts/stage-driver-properties.sh
# refuses any other key); every other value comes from driver.properties.
aeron.threading.mode=DEDICATED
aeron.conductor.idle.strategy=noop
aeron.sender.idle.strategy=noop
aeron.receiver.idle.strategy=noop
