# Idle overlay of the external media driver (aeronmd): the busy_spin idle mode, the same vocabulary as every
# process's idle setting (TRANSPORT_IDLE_MODE, FWD_IDLE_MODE, BRIDGE_IDLE_MODE). Loaded LAST:
#   aeronmd driver.properties driver-<dev|prod>.properties driver-idle-busy_spin.properties
# so the threading mode comes from the profile overlay and the idle strategies from this file (a later file wins).
# An idle overlay sets the idle strategy of every agent role (and the sleep duration) only, never the threading mode
# (scripts/stage-driver-properties.sh refuses any other key; runtime.idle_mode checks the values against
# runtime/include/cluster_tools/runtime/IdleMode.h, the mapping the embedded driver uses).
# busy_spin: Aeron "spin" (aeron_idle_strategy_busy_spinning): every driver thread spins a CPU while idle.
aeron.conductor.idle.strategy=spin
aeron.sender.idle.strategy=spin
aeron.receiver.idle.strategy=spin
aeron.shared.idle.strategy=spin
aeron.sharednetwork.idle.strategy=spin
# No init args (an empty value unsets one an earlier file may have set: aeron_properties_setenv).
aeron.conductor.idle.strategy.init.args=
aeron.sender.idle.strategy.init.args=
aeron.receiver.idle.strategy.init.args=
aeron.shared.idle.strategy.init.args=
aeron.sharednetwork.idle.strategy.init.args=
