# Dev overlay of the external media driver (aeronmd), loaded after the pinned
# driver.properties: SHARED threading and backoff idles. One driver thread that
# yields when idle; the profile for small boxes and for every worker's driver.
# An overlay sets threading and idle strategies only (scripts/stage-driver-properties.sh
# refuses any other key); every other value comes from driver.properties.
aeron.threading.mode=SHARED
aeron.conductor.idle.strategy=backoff
aeron.sender.idle.strategy=backoff
aeron.receiver.idle.strategy=backoff
aeron.shared.idle.strategy=backoff
