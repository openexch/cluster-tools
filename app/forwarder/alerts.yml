# Prometheus alert rules for ct-forwarder. Scrape: GET /metrics on FWD_HTTP_BIND.
# The pending-oldest signal lives at the core, where the pending set is (assets grafana/alerts.yml DispatchStuck,
# A-3): a forwarder cannot see a dispatch it never received.
groups:
  - name: forwarder
    rules:
      - alert: ForwarderInvalidDispatch
        # a correct core yields no anomalous dispatch: every one is a core defect
        expr: increase(forwarder_invalid_dispatch_total[5m]) > 0
        labels: { severity: page }
        annotations:
          summary: "forwarder relayed an anomalous dispatch (rule {{ $labels.rule }}, action {{ $labels.action }})"
      - alert: ForwarderRingOverflow
        expr: increase(forwarder_ring_overflow_total[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "send ring overflowed: the ME is not draining (D3, then RESYNC(cursor))"
      - alert: ForwarderNotReady
        expr: forwarder_ready == 0
        for: 10s
        labels: { severity: page }
        annotations:
          summary: "forwarder not ready (GET /ready names the failing conjuncts)"
      - alert: ForwarderBehindCoreHead
        # Gated on pending work. last_sent vs core_head stood high on an idle market, after a restart and
        # at N = 2 (a dispatch resolved without this forwarder sending it); a non-empty ring whose head has waited 5 s
        # is work that is not moving, whatever the other forwarder did.
        expr: forwarder_ring_depth > 0 and forwarder_ring_head_age_ms > 5000
        for: 5s
        labels: { severity: warning }
        annotations:
          summary: "dispatches wait in the send ring and the ME accepts none of them"
      - alert: ForwarderResyncTimeouts
        expr: increase(forwarder_resync_timeouts_total[1m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "RequestPendingDispatch unanswered more than twice in a minute (T9)"
      - alert: ForwarderResyncShapeViolation
        # the reply-block rule of 6.1 rests on core properties: a violation is a core defect
        expr: increase(forwarder_resync_shape_violation_total[5m]) > 0
        labels: { severity: page }
        annotations:
          summary: "resync reply shape check {{ $labels.check }} failed (RESYNC(0) ran)"
      - alert: ForwarderConnectClusterError
        # the session limit of 50 or a transient refusal: retried with backoff, but someone must look
        expr: increase(forwarder_connect_cluster_error_total[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.cluster }} refused a forwarder session (CLUSTER_ERROR)"
      - alert: ForwarderStaleTermFrames
        # a deposed leader still draining its egress image to this forwarder
        expr: rate(forwarder_core_stale_term_total[1m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "core frames of an ended leadership term keep arriving"
      - alert: ForwarderMeEgressStale
        expr: forwarder_me_egress_age_ms > 5000
        labels: { severity: warning }
        annotations:
          summary: "no ME egress frame for more than 5 s"
      - alert: ForwarderEmbeddedDriver
        # Checklist C13: the embedded media driver is for dev and demo only; the prod profile runs
        # FWD_DRIVER_MODE=external on the host aeronmd that admin / cloud-console manage
        expr: forwarder_driver_mode{mode="embedded"} == 1
        labels: { severity: info }
        annotations:
          summary: "ct-forwarder runs its own embedded media driver (dev/demo only; prod is FWD_DRIVER_MODE=external)"
      - alert: ForwarderStorageStarved
        # An ingress publication refused for storage space; exit 70 after 30 s (restartable, loud)
        expr: increase(forwarder_storage_starved_seconds_total[1m]) > 0
        labels: { severity: page }
        annotations:
          summary: "ct-forwarder starved of storage in the media driver dir (it exits 70 after 30 s): grow or clean the tmpfs"
      # (MarketTick). BOOK_STALE drives forwarder_ticks_ready only, never the dispatch /ready
      # One ME market-data defect must not take dispatch readiness from every forwarder at once.
      - alert: ForwarderBookBroken
        expr: forwarder_book_broken_age_ms > 15000
        labels: { severity: warning }
        annotations:
          summary: "market {{ $labels.market }} book chain BROKEN for more than 15 s (no snapshot repaired it)"
      - alert: ForwarderBookSnapshotStale
        expr: forwarder_book_snapshot_age_ms > 25000 and forwarder_book_state == 1
        labels: { severity: warning }
        annotations:
          summary: "market {{ $labels.market }}: no BookSnapshot for 25 s on an OK ladder (the ME resnapshot rhythm is dead)"
      - alert: ForwarderTickStuck
        # E11: 0 while BROKEN, EMPTY or gated, so a case-B break or a core election never pages
        expr: forwarder_tick_pending_age_ms > 2000
        for: 10s
        labels: { severity: page }
        annotations:
          summary: "market {{ $labels.market }}: a book change the emitter may send has waited more than 2 s"
      - alert: ForwarderTicksNotReady
        expr: forwarder_ticks_ready == 0
        for: 10s
        labels: { severity: page }
        annotations:
          summary: "tick readiness lost (BOOK_STALE; GET /health ticksReady names the market and condition)"
      - alert: ForwarderTickRefused
        # E9: a candidate the stitcher cannot vouch for (crossed, negative, version 0): a stitcher or ME defect
        expr: increase(forwarder_tick_refused_total[5m]) > 0
        labels: { severity: page }
        annotations:
          summary: "market {{ $labels.market }}: the forwarder refused its own MarketTick candidate"
      - alert: ForwarderTickRejected
        # 7.3: the core refused a 60 for session authority; repaired by re-registration
        expr: increase(forwarder_tick_rejected_total[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "the core rejected a MarketTick ({{ $labels.reason }}): registration lost under the ticks"
      - alert: ForwarderBookDefect
        # a correct ME and stitcher never produce these causes (from_mismatch is the expected lossy / failover cause)
        expr: increase(forwarder_book_chain_breaks_total{cause=~"level_op|depth|crossed|malformed"}[5m]) > 0
        labels: { severity: page }
        annotations:
          summary: "market {{ $labels.market }} book chain broke with cause {{ $labels.cause }} (a stitcher or ME defect)"
      - alert: ForwarderBookLossy
        expr: increase(forwarder_book_broken_seconds_total[10m]) > 60
        labels: { severity: warning }
        annotations:
          summary: "market {{ $labels.market }} book spent more than 60 s of the last 10 min BROKEN (persistently lossy)"
      - alert: ForwarderBookForeignMarket
        expr: increase(forwarder_book_foreign_market_total[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "ME book frames for a market outside 1..5 (deployment mismatch with the core's market count)"
      - alert: ForwarderMeUnknownTemplate
        # 22 / 25 / 26 are stitched and 23 / 24 / 27 known-ignored: anything else is a schema drift
        expr: increase(forwarder_unknown_template_total{cluster="me"}[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "ME egress template {{ $labels.template }} unknown to this forwarder"
